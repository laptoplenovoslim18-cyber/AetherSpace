<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherSpace | AI Studio & Gateway</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-root" class="app-layout">
    
    <!-- TOP NAVIGATION -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-logo">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="brand-title">AetherSpace</span>
        </div>

        <div class="model-quick-selector">
          <select id="header-model-select" class="header-select" title="Aktives KI-Modell wechseln">
            <optgroup label="Google AI Studio (Top 3)">
              <option value="gemini-3.7-flash" selected>Gemini 3.7 Flash</option>
              <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
              <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
            </optgroup>
            <optgroup label="Groq Cloud (Top 3)">
              <option value="llama-3.3-70b-versatile">Groq Llama 3.3 70B</option>
              <option value="deepseek-r1-distill-llama-70b">Groq DeepSeek R1 Distill 70B</option>
              <option value="llama-3.1-8b-instant">Groq Llama 3.1 8B</option>
            </optgroup>
            <optgroup label="OpenRouter Free Tier (Top 3)">
              <option value="openrouter/free">OpenRouter Auto Free</option>
              <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free)</option>
              <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Free)</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="header-right">
        <button class="action-btn accent" id="btn-codepen-export" title="Generierten HTML/CSS/JS-Code direkt auf CodePen öffnen">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/><polyline points="2 15.5 12 8.5 22 15.5"/><line x1="12" y1="2" x2="12" y2="8.5"/></svg>
          <span>Open in CodePen</span>
        </button>

        <button class="action-btn" id="open-key-vault-btn" title="API-Keys verwalten">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Key Vault</span>
          <span class="badge" id="key-count-badge">0 Keys</span>
        </button>

        <button class="action-btn primary" id="toggle-run-settings-btn" title="Laufzeit- und Router-Einstellungen">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Run Settings</span>
        </button>
      </div>
    </header>

    <!-- UNIFIED FULL-SCREEN CHAT & CODE WORKBENCH -->
    <main class="chat-main-container">
      <div class="chat-scroll-stream" id="chat-stream">
        <!-- CHAT NACHRICHTEN WERDEN HIER EINGEFÜGT -->
      </div>

      <!-- GROSSES EINGABEFELD & CONTROLS -->
      <div class="chat-bottom-bar">
        <div class="input-wrapper">
          <textarea class="chat-prompt-textarea" id="chat-input" rows="2" placeholder="Nachricht oder Programmierauftrag eingeben (Enter zum Senden, Shift+Enter für Zeilenumbruch)..."></textarea>
          <div class="input-actions-row">
            <div class="status-indicator-group">
              <span class="status-indicator ready" id="gateway-status-dot"></span>
              <span class="status-label" id="gateway-status-text">Bereit • Cloud Mesh aktiv</span>
            </div>
            <div class="action-buttons-group">
              <button class="action-sub-btn" id="btn-clear-chat" title="Chatverlauf leeren">Verlauf leeren</button>
              <button class="send-prompt-btn" id="btn-send-prompt">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                <span>Senden</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- RUN SETTINGS SLIDEOUT -->
    <aside class="settings-slideout" id="settings-slideout">
      <div class="slideout-header">
        <div class="slideout-title">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Run Settings</span>
        </div>
        <button class="icon-tool-btn" id="btn-close-settings">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="slideout-content">
        <div class="form-group">
          <label class="form-label" for="setting-system-instructions">System Instructions</label>
          <textarea class="form-textarea" id="setting-system-instructions" rows="4" placeholder="Optional: Eigene System-Anweisungen definieren (bleibt standardmäßig leer)..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="setting-thinking-level">Thinking Budget (Tokens)</label>
          <select class="form-select" id="setting-thinking-level">
            <option value="0">0 (Deaktiviert / Instant)</option>
            <option value="1024">1,024 (Niedrig)</option>
            <option value="4096" selected>4,096 (Standard)</option>
            <option value="16384">16,384 (Tiefes Denken)</option>
          </select>
        </div>

        <div class="toggle-setting-row">
          <div class="toggle-info">
            <span class="toggle-title">Automatischer 503/429 Fallback</span>
            <span class="toggle-desc">Bei Serverlast automatisch auf nächstes Top-Modell schalten</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-auto-fallback" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-setting-row">
          <div class="toggle-info">
            <span class="toggle-title">Google Search Grounding</span>
            <span class="toggle-desc">Live-Websuche in API-Aufrufen</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-search-grounding">
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label">Max Output Tokens</label>
            <span class="range-val" id="setting-output-length-val">8192</span>
          </div>
          <input type="range" class="form-range" id="setting-output-length" min="256" max="65536" step="256" value="8192">
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label">Temperature</label>
            <span class="range-val" id="setting-temp-val">0.70</span>
          </div>
          <input type="range" class="form-range" id="setting-temp" min="0.0" max="2.0" step="0.05" value="0.70">
        </div>
      </div>
    </aside>

    <!-- KEY VAULT MODAL -->
    <div class="modal-overlay" id="key-vault-modal" style="display:none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <h2>API Key Vault</h2>
          </div>
          <button class="icon-tool-btn" id="btn-close-vault">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="vault-tabs">
          <button class="vault-tab-btn active" data-provider="gemini">Google AI Studio</button>
          <button class="vault-tab-btn" data-provider="groq">Groq Cloud</button>
          <button class="vault-tab-btn" data-provider="openrouter">OpenRouter</button>
        </div>

        <div class="vault-body">
          <div class="key-add-bar">
            <input type="password" class="vault-input" id="vault-key-input" placeholder="API Key einfügen (z.B. AIzaSy... oder gsk_...)">
            <input type="text" class="vault-input small" id="vault-label-input" placeholder="Label (z.B. Key 1)">
            <button class="btn-sm primary" id="btn-add-key">+ Speichern</button>
          </div>

          <div class="vault-table-wrapper">
            <table class="vault-table">
              <thead>
                <tr>
                  <th>Key Mask</th>
                  <th>Label</th>
                  <th>Status</th>
                  <th>Erstellt</th>
                  <th>Aktion</th>
                </tr>
              </thead>
              <tbody id="vault-keys-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
