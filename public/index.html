<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherSpace</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-root" class="app-layout">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-logo">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="brand-title">AetherSpace</span>
        </div>

        <!-- MODE SELECTOR -->
        <div class="mode-toggles">
          <button class="mode-btn active" id="mode-direct" data-mode="direct">Direct LLM</button>
          <button class="mode-btn" id="mode-multiagent" data-mode="multiagent">Multi-Agent</button>
          <button class="mode-btn" id="mode-orchestration" data-mode="orchestration">Orchestration</button>
        </div>
      </div>

      <div class="header-right">
        <!-- DYNAMIC MODEL SELECTOR -->
        <div class="model-select-wrapper">
          <select class="header-select" id="header-model-select">
            <option value="" disabled selected>Select Model (Fetch via Vault)</option>
          </select>
          <button class="icon-tool-btn" id="btn-refresh-models" title="Live Refresh Models from Provider API">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>

        <button class="action-btn" id="btn-open-vault">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Key Vault</span>
          <span class="badge" id="key-count-badge">0 Keys</span>
        </button>

        <button class="action-btn primary" id="btn-toggle-settings">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Run Settings</span>
        </button>
      </div>
    </header>

    <!-- UNIFIED SINGLE SCREEN VIEWPORT -->
    <main class="chat-viewport">
      
      <!-- STREAMING MESSAGE CONTAINER -->
      <div class="message-feed" id="message-feed">
        <!-- Dynamic Chat Messages & Streaming Output -->
      </div>

      <!-- INPUT BAR -->
      <div class="input-deck">
        <div class="input-wrapper">
          <textarea class="chat-input" id="chat-input" rows="1" placeholder="Type a message or instruction (Enter to send, Shift+Enter for new line)..."></textarea>
          <div class="input-actions">
            <button class="btn-clear" id="btn-clear-feed" title="Clear Dialogue">Clear</button>
            <button class="btn-send" id="btn-send-message">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- RUN SETTINGS DRAWER -->
    <aside class="settings-drawer" id="settings-drawer">
      <div class="drawer-header">
        <span class="drawer-title">Run Settings</span>
        <button class="icon-tool-btn" id="btn-close-settings">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="drawer-body">
        <div class="form-group">
          <label class="form-label" for="setting-system-instructions">System Instructions</label>
          <textarea class="form-textarea" id="setting-system-instructions" rows="4" placeholder="(Optional) Set behavior or persona..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="setting-thinking-budget">Thinking Budget (Tokens)</label>
          <select class="form-select" id="setting-thinking-budget">
            <option value="0" selected>0 (Off / Default)</option>
            <option value="1024">1,024</option>
            <option value="4096">4,096</option>
            <option value="8192">8,192</option>
          </select>
        </div>

        <div class="form-group">
          <div class="toggle-row">
            <span class="toggle-label">Search Grounding (Google)</span>
            <label class="switch">
              <input type="checkbox" id="setting-search-grounding">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <div class="toggle-row">
            <span class="toggle-label">Automatic Failover Cascade</span>
            <label class="switch">
              <input type="checkbox" id="setting-auto-cascade" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <div class="slider-header">
            <label class="form-label">Temperature</label>
            <span class="slider-value" id="val-temperature">0.70</span>
          </div>
          <input type="range" class="form-range" id="setting-temperature" min="0" max="2" step="0.05" value="0.70">
        </div>

        <div class="form-group">
          <div class="slider-header">
            <label class="form-label">Max Output Tokens</label>
            <span class="slider-value" id="val-max-tokens">8192</span>
          </div>
          <input type="range" class="form-range" id="setting-max-tokens" min="256" max="32768" step="256" value="8192">
        </div>
      </div>
    </aside>

    <!-- KEY VAULT MODAL -->
    <div class="modal-backdrop" id="vault-modal" style="display:none;">
      <div class="modal-container">
        <div class="modal-header">
          <span class="modal-title">API Key Vault & Dynamic Discovery</span>
          <button class="icon-tool-btn" id="btn-close-vault">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="vault-tabs">
          <button class="vault-tab-btn active" data-provider="gemini">Google AI Studio</button>
          <button class="vault-tab-btn" data-provider="groq">Groq Cloud</button>
          <button class="vault-tab-btn" data-provider="openrouter">OpenRouter</button>
        </div>

        <div class="modal-body">
          <div class="vault-add-row">
            <input type="password" class="form-input" id="vault-key-input" placeholder="Paste API key...">
            <input type="text" class="form-input small" id="vault-label-input" placeholder="Label">
            <button class="btn-primary" id="btn-save-key">Add & Fetch</button>
          </div>

          <div class="vault-table-wrapper">
            <table class="vault-table">
              <thead>
                <tr>
                  <th>Key Preview</th>
                  <th>Label</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="vault-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
