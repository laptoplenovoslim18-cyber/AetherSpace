<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherSpace | AI Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-root" class="app-layout">
    <!-- TOP NAVIGATION BAR -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-logo">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="brand-title">AetherSpace</span>
        </div>

        <div class="model-picker-wrapper">
          <select id="model-select" class="header-select" title="Active Model">
            <option value="auto">Auto-Select (Dynamic Fetch)</option>
          </select>
          <button id="btn-refresh-models" class="icon-tool-btn" title="Fetch Live Models from API">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
        </div>
      </div>

      <div class="header-right">
        <button class="action-btn" id="btn-codepen" title="Export Current Code Artifacts to CodePen">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/><polyline points="2 15.5 12 8.5 22 15.5"/><line x1="12" y1="2" x2="12" y2="8.5"/></svg>
          <span>CodePen</span>
        </button>

        <button class="action-btn" id="btn-key-vault">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Key Vault</span>
          <span class="badge" id="key-count-badge">0</span>
        </button>

        <button class="action-btn" id="btn-toggle-settings" title="Engine Settings">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <button class="action-btn" id="btn-clear-chat" title="Clear Conversation History">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </header>

    <!-- UNIFIED MAIN VIEWPORT -->
    <main class="chat-viewport">
      <div class="chat-stream-container" id="chat-stream">
        <div class="chat-welcome-box" id="welcome-box">
          <h2>Unified AI Gateway</h2>
          <p>Direct API integration with dynamic model fetching and automated fallback.</p>
        </div>
      </div>

      <!-- BOTTOM PROMPT DOCK -->
      <div class="prompt-dock">
        <div class="prompt-status-bar" id="gateway-status-bar">
          <span class="status-indicator ready" id="gateway-status-dot"></span>
          <span id="gateway-status-text">Gateway Ready (BYOK Client Mode)</span>
        </div>
        <div class="prompt-input-container">
          <textarea id="prompt-input" rows="1" placeholder="Type prompt, ask question, or request code (Enter to send, Shift+Enter for newline)..." autofocus></textarea>
          <button id="btn-send" class="send-btn" title="Execute Prompt">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- SETTINGS SLIDEOUT DRAWER -->
    <aside class="settings-drawer" id="settings-drawer">
      <div class="drawer-header">
        <h3>Engine Settings</h3>
        <button id="btn-close-settings" class="icon-tool-btn">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="form-group">
          <label for="system-instructions">System Instructions</label>
          <textarea id="system-instructions" rows="4" placeholder="Optional system instruction (leave empty for default)..."></textarea>
        </div>
        <div class="form-group">
          <label for="thinking-budget">Thinking Budget (Tokens)</label>
          <select id="thinking-budget" class="form-select">
            <option value="0">0 (Disabled / Instant)</option>
            <option value="1024">1,024 (Low)</option>
            <option value="4096" selected>4,096 (Medium)</option>
            <option value="16384">16,384 (Deep Reasoning)</option>
          </select>
        </div>
        <div class="form-group toggle-group">
          <label for="search-grounding">Search Grounding</label>
          <input type="checkbox" id="search-grounding">
        </div>
        <div class="form-group toggle-group">
          <label for="auto-fallback">Auto-Fallback Mesh</label>
          <input type="checkbox" id="auto-fallback" checked>
        </div>
        <div class="form-group">
          <div class="range-header">
            <label>Max Output Tokens</label>
            <span id="output-tokens-val">8192</span>
          </div>
          <input type="range" id="max-output-tokens" min="512" max="65536" step="512" value="8192">
        </div>
        <div class="form-group">
          <div class="range-header">
            <label>Temperature</label>
            <span id="temp-val">0.70</span>
          </div>
          <input type="range" id="temperature" min="0" max="2" step="0.05" value="0.70">
        </div>
      </div>
    </aside>

    <!-- KEY VAULT MODAL -->
    <div class="modal-backdrop" id="vault-modal" style="display: none;">
      <div class="modal-box">
        <div class="modal-header">
          <h3>API Key Vault</h3>
          <button id="btn-close-vault" class="icon-tool-btn">&times;</button>
        </div>
        <div class="modal-tabs">
          <button class="tab-btn active" data-provider="gemini">Google AI Studio</button>
          <button class="tab-btn" data-provider="groq">Groq Cloud</button>
          <button class="tab-btn" data-provider="openrouter">OpenRouter</button>
        </div>
        <div class="modal-body">
          <div class="input-row">
            <input type="password" id="vault-key-input" placeholder="Paste API Key (e.g. AIzaSy... or gsk_...)">
            <button id="btn-add-key" class="btn-primary">+ Save Key</button>
          </div>
          <div class="key-list-wrapper">
            <table class="key-table">
              <thead>
                <tr>
                  <th>Key Mask</th>
                  <th>Created</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="key-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
